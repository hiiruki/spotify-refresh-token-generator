name = "spotify-refresh-token-generator"
compatibility_date = "2026-09-23"
pages_build_output_dir = "public"

# Local dev only. In production (Cloudflare dashboard), bind the KV namespace
# under: Workers & Pages → your project → Settings → Functions → KV namespace bindings
# Variable name must be OAUTH_KV, pointing at whatever KV namespace you create.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "c162b6532f554ea688f9cc8f82f00961"

# Local dev only. In production, set this under: Workers & Pages → your project →
# Settings → Environment variables → add "APP_DOMAIN" for both Production and Preview.
[vars]
APP_DOMAIN = "spotgen.hiiruki.moe"
